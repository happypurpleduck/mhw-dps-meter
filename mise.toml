[tools]
# Keep .NET aligned with global.json and Rust/Node aligned with CI.
dotnet = "8.0.424"
node = "22.23.2"
pnpm = "10.34.5"
python = "3.12.14"
# Put Rust last: distro rustup can add /usr/bin to PATH.
rust = "1.96.0"

[tasks.setup]
description = "Install JavaScript dependencies and restore the plugin projects"
run = [
  "npm ci --ignore-scripts",
  "pnpm --dir web install --frozen-lockfile",
  "pnpm --dir gpui-viewer/www install --frozen-lockfile",
  "dotnet restore src/MhwDpsMeter/MhwDpsMeter.csproj --locked-mode",
  "dotnet restore tests/PluginRegression/PluginRegression.csproj --locked-mode",
]

[tasks."build:plugin"]
description = "Build the plugin in Release mode"
run = "dotnet build src/MhwDpsMeter/MhwDpsMeter.csproj -c Release -p:RestoreLockedMode=true"

[tasks."test:plugin"]
description = "Run plugin regression tests"
run = [
  "dotnet restore tests/PluginRegression/PluginRegression.csproj --locked-mode",
  "dotnet run --project tests/PluginRegression -c Release --no-restore",
]

[tasks."build:viewer"]
description = "Build the native GPUI viewer (requires platform libraries)"
dir = "{{config_root}}/gpui-viewer"
run = "cargo build --locked --release --bin mhw-log-viewer"

[tasks."test:viewer"]
description = "Run native viewer library tests (requires platform libraries)"
dir = "{{config_root}}/gpui-viewer"
run = "cargo test --locked --release --lib"

[tasks."dev:web"]
description = "Start the web viewer development server"
run = "pnpm --dir web dev"

[tasks."build:web"]
description = "Type-check and build the web viewer"
run = "pnpm --dir web build"

[tasks."test:web"]
description = "Run web viewer tests"
run = "pnpm --dir web test"

[tasks."check:versions"]
description = "Check product release versions"
run = "python3 scripts/release.py check"

[tasks."test:release"]
description = "Run release tooling tests"
run = "python3 -m unittest discover -s tests/release -v"

[tasks.test]
description = "Run all tests and check release versions"
depends = ["test:plugin", "test:viewer", "test:web", "test:release", "check:versions"]
