name: CI and release

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  # Access the master Rust caches at least twice weekly (GitHub evicts idle caches).
  # Release publishing is explicitly disabled for scheduled validation.
  schedule:
    - cron: '23 4 * * 1,4'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a release while its assets are being uploaded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      plugin: ${{ steps.select.outputs.plugin }}
      viewer: ${{ steps.select.outputs.viewer }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify PR changes
        id: select
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  tooling:
    name: Release tooling
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:versions
      - run: npm run test:release
      - name: Validate changeset plan
        # Version PRs have consumed their changesets; maintenance can omit them.
        run: |
          git show-ref --verify --quiet refs/heads/master || git branch master origin/master
          for file in .changeset/*.md; do
            if [ "$file" != '.changeset/README.md' ]; then
              npm run changeset -- status
              break
            fi
          done

  plugin:
    name: Plugin (${{ matrix.os }})
    needs: scope
    # Expand both platform check contexts, even when plugin work is unnecessary.
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      RUN_COMPONENT: ${{ github.event_name != 'pull_request' || needs.scope.outputs.plugin == 'true' }}
    steps:
      - name: Not affected by PR
        if: env.RUN_COMPONENT != 'true'
        run: echo "plugin checks not needed for this PR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_COMPONENT == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: env.RUN_COMPONENT == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore src/MhwDpsMeter/MhwDpsMeter.csproj --locked-mode
        if: env.RUN_COMPONENT == 'true'
      - run: dotnet restore tests/PluginRegression/PluginRegression.csproj --locked-mode
        if: env.RUN_COMPONENT == 'true'
      - run: dotnet run --project tests/PluginRegression -c Release --no-restore
        if: env.RUN_COMPONENT == 'true'
      - name: Restore native memory regression runner
        if: env.RUN_COMPONENT == 'true' && (runner.os == 'Windows')
        run: dotnet restore tests/NativeMemoryRegression/NativeMemoryRegression.csproj --locked-mode
      - name: Test protected native memory reads
        if: env.RUN_COMPONENT == 'true' && (runner.os == 'Windows')
        run: dotnet run --project tests/NativeMemoryRegression -c Release --no-restore
      - name: Build plugin
        if: env.RUN_COMPONENT == 'true'
        run: dotnet build src/MhwDpsMeter/MhwDpsMeter.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true -p:BuildStamp=${{ github.sha }}
      - name: Package shared Windows and Proton DLL
        if: env.RUN_COMPONENT == 'true' && (runner.os == 'Linux')
        run: python3 scripts/release.py package --product plugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN_COMPONENT == 'true' && (runner.os == 'Linux')
        with:
          name: plugin
          path: dist/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  viewer:
    name: Viewer (${{ matrix.platform }})
    needs: scope
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
    env:
      RUN_COMPONENT: ${{ github.event_name != 'pull_request' || needs.scope.outputs.viewer == 'true' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/gpui-viewer/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - name: Not affected by PR
        if: env.RUN_COMPONENT != 'true'
        run: echo "viewer checks not needed for this PR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_COMPONENT == 'true'
        with:
          persist-credentials: false
      - name: Install Linux libraries
        if: env.RUN_COMPONENT == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan-dev vulkan-validationlayers
      - name: Install Rust
        if: env.RUN_COMPONENT == 'true'
        run: rustup toolchain install 1.96.0 --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.RUN_COMPONENT == 'true'
        with:
          workspaces: gpui-viewer -> target
          key: ${{ matrix.target }}-1.96.0
          # PR caches can be reused by later commits on the same PR. The scheduled
          # master build keeps a base cache available to new PRs.
          save-if: true
      - name: Test viewer
        if: env.RUN_COMPONENT == 'true'
        working-directory: gpui-viewer
        run: cargo +1.96.0 test --locked --release --target ${{ matrix.target }} --lib
      - name: Build viewer
        if: env.RUN_COMPONENT == 'true'
        working-directory: gpui-viewer
        run: cargo +1.96.0 build --locked --release --target ${{ matrix.target }} --bin mhw-log-viewer
      - name: Package viewer
        if: env.RUN_COMPONENT == 'true'
        run: python scripts/release.py package --product viewer --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN_COMPONENT == 'true'
        with:
          name: viewer-${{ matrix.platform }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14

  web:
    name: SolidJS web viewer
    needs: scope
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      RUN_COMPONENT: ${{ github.event_name != 'pull_request' || needs.scope.outputs.web == 'true' }}
    steps:
      - name: Not affected by PR
        if: env.RUN_COMPONENT != 'true'
        run: echo "web checks not needed for this PR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_COMPONENT == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN_COMPONENT == 'true'
        with:
          node-version: '22'
      - name: Install pinned pnpm
        if: env.RUN_COMPONENT == 'true'
        run: npm install -g pnpm@10.34.5
      - name: Install web dependencies
        if: env.RUN_COMPONENT == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test web viewer
        if: env.RUN_COMPONENT == 'true'
        working-directory: web
        run: pnpm test
      - name: Typecheck and build web viewer
        if: env.RUN_COMPONENT == 'true'
        working-directory: web
        run: pnpm build

  release:
    name: Version PR or GitHub release
    timeout-minutes: 15
    needs: [tooling, plugin, viewer, web]
    # Never publish or create release PRs from scheduled cache refresh runs.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/artifacts
          merge-multiple: true
      - name: Create or update release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          pr-title: 'chore: release plugin and viewer'
          commit-message: 'chore: version packages and update changelogs'
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Describe binary releases in the PR
        if: steps.changesets.outputs.has-changesets == 'true' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          python3 - <<'PYBODY'
          import os, pathlib, subprocess
          number = os.environ['PR_NUMBER']
          body = subprocess.check_output(['gh', 'pr', 'view', number, '--json', 'body', '--jq', '.body'], text=True)
          summary = body.partition('# Releases')[2]
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-pr-body.md'
          path.write_text('Merge this PR to release the versions below after Linux and Windows builds pass. '
                          'GitHub releases include binary archives and SHA-256 checksums.\n\n# Releases' + summary)
          subprocess.run(['gh', 'pr', 'edit', number, '--body-file', str(path)], check=True)
          PYBODY
      # GITHUB_TOKEN-generated pushes do not trigger CI; workflow_dispatch does.
      - name: Run checks on the bot release branch
        if: steps.changesets.outputs.has-changesets == 'true' && steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built archives
        if: steps.changesets.outputs.has-changesets == 'false'
        run: python3 scripts/release.py publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
