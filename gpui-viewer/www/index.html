<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHW Fight Logs (GPUI)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; user-select: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; }
      .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid rgba(255,255,255,.12); border-left-color: #fafafa; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { max-width: 520px; text-align: center; line-height: 1.4; pointer-events: auto; }
      .error code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading GPUI…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
